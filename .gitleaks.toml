title = "harbor"

[extend]
useDefault = true

[[rules]]
id = "harbor-tailscale-cgnat-ip"
description = "IPv4 literal in the Tailscale carrier-grade NAT range"
regex = '''(^|[^0-9.])100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}'''

[[rules]]
id = "harbor-magicdns-suffix"
description = "MagicDNS name other than the TAILNET.ts.net and SHARED.ts.net placeholders"
regex = '''[A-Za-z0-9-]+\.ts\.net'''
# Two placeholders, not one, because a machine shared in from another tailnet
# appears in "tailscale status" carrying the sharer's suffix, and a fixture that
# cannot spell a second tailnet cannot test that Harbor refuses to aim an ssh
# block at someone else's node. Both are exact matches on an upper-case name no
# tailnet can have -- Tailscale's own suffixes are lower case -- so this stays an
# allowlist of two fixed strings rather than a pattern a real name could satisfy.
[rules.allowlist]
regexes = ['''^TAILNET\.ts\.net$''', '''^SHARED\.ts\.net$''']

[[rules]]
id = "harbor-tailscale-auth-key"
description = "Tailscale auth key prefix"
regex = '''tskey[-][A-Za-z0-9-]+'''

[[rules]]
id = "harbor-email"
description = "Email address outside example.com"
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'''
[rules.allowlist]
# OpenSSH names its certificate and security-key algorithms with @openssh.com.
# These are protocol constants, not addresses; only the exact identifiers pass.
#
# git@github.com is the fixed SSH login of every GitHub remote, the account name
# half of a URL rather than anyone's address, and it is not a secret: it is the
# same three words in every clone command GitHub prints. It is allowlisted exactly,
# so an actual address at github.com would still be reported. gitleaks detect reads
# the whole history, so a remote URL written into any commit keeps failing the lane
# for every branch afterwards even once the file holding it is gone.
regexes = [
  '''@example\.com$''',
  '''^ssh-ed25519-cert-v01@openssh\.com$''',
  '''^sk-ssh-ed25519@openssh\.com$''',
  '''^-cert-v01@openssh\.com$''',
  '''^git@github\.com$''',
]

[[rules]]
id = "harbor-clerk-user-id"
description = "Clerk user id prefix"
regex = '''user_[A-Za-z0-9]{20,}'''

[[rules]]
id = "harbor-url-secret-param"
description = "URL parameter or fragment named token, code, key, secret, or wsTicket"
regex = '''[?&#](token|code|key|secret|wsTicket)=[^&#[:space:]]+'''

[allowlist]
paths = ['''^\.gitleaks\.toml$''', '''^fleet/tests/lint/placeholder-patterns\.txt$''']
