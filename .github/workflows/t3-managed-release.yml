name: t3-managed-release
run-name: t3-managed-release ${{ inputs.expected_main_sha || github.sha }}

# Trusted default-branch publication of one immutable managed T3 release.
# One resolve job on Ubuntu proves the checked-in lock, patches, and upstream
# provenance, re-reads the official upstream release and tag, fixes the
# managed version with the existing resolver (commit-count counter blocks,
# with a run-number offset for manual rebuilds; the
# exact workflow SHA as the builder revision, the newest published immutable
# managed release as the prior), and refuses any tag collision before native
# build time is spent. Four static matrix rows each prepare a fresh source
# tree and run exactly one existing builder for one artifact. One publish job
# on Ubuntu repeats the trust checks, assembles the four archives with the
# existing manifest writer into the six-file feed closure, and publishes it
# through the checked-in publisher as one draft-then-published prerelease.
# Nothing here signs, notarizes, caches, consumes upstream binaries or npm
# packages, or edits, deletes, reuses, or overwrites an existing release,
# tag, or asset. Every job runs only for kgarg2468/harbor on main, and only
# the publish job can write. Every release operation runs on the workflow's
# own GITHUB_TOKEN; the one read GitHub serves only to repository
# Administration (the immutable-releases setting) uses the separate
# fine-grained secret T3_MANAGED_RELEASE_ADMIN_READ_TOKEN, which needs only
# Administration read, is exported only to the two steps that perform that
# check, and reaches gh only as that check's child GH_TOKEN.
# Contract: t3-reasoning/docs/nightly-automation.md.

on:
  push:
    branches: [main]
    paths:
      - t3-reasoning/source.lock.json
      - t3-reasoning/upstream-release.json
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact main SHA for automated promotion; omit for a manual rebuild
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Serialize attempts for the exact SHA, including duplicate dispatches.
# A run that is already publishing must finish.
concurrency:
  group: t3-managed-release-${{ inputs.expected_main_sha || github.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.13.1"
  PNPM_VERSION: "11.10.0"
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  resolve:
    if: github.repository == 'kgarg2468/harbor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.resolve.outputs.release_version }}
      release_tag: ${{ steps.preflight.outputs.release_tag }}
      upstream_version: ${{ steps.resolve.outputs.upstream_version }}
      upstream_commit: ${{ steps.resolve.outputs.upstream_commit }}
      builder_revision: ${{ steps.resolve.outputs.builder_revision }}
      release_input_sha256: ${{ steps.resolve.outputs.release_input_sha256 }}
      public_config_sha256: ${{ steps.resolve.outputs.public_config_sha256 }}
      prior_tag: ${{ steps.prior.outputs.prior_tag }}
    steps:
      - name: Require expected main SHA before checkout
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          if [ -n "${EXPECTED_MAIN_SHA}" ]; then
            if ! [[ "${EXPECTED_MAIN_SHA}" =~ ^[0-9a-f]{40}$ ]] || [ "${EXPECTED_MAIN_SHA}" != "${GITHUB_SHA}" ]; then
              echo "::error::expected main SHA does not match this workflow revision"
              exit 1
            fi
          fi

      - name: Check out trusted default-branch code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.13.1"

      - name: Require the exact trusted commit, a clean tree, and the pinned toolchain
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "${head}" != "${GITHUB_SHA}" ]; then
            echo "::error::checkout HEAD ${head} is not the trusted commit ${GITHUB_SHA}"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::checkout is not clean"
            exit 1
          fi
          if [ "$(node --version)" != "v${NODE_VERSION}" ]; then
            echo "::error::node $(node --version) is not v${NODE_VERSION}"
            exit 1
          fi
          npm install --global "pnpm@${PNPM_VERSION}"
          if [ "$(pnpm --version)" != "${PNPM_VERSION}" ]; then
            echo "::error::pnpm $(pnpm --version) is not ${PNPM_VERSION}"
            exit 1
          fi
          gh --version

      - name: Verify the lock, patches, provenance, and the official upstream release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node t3-reasoning/scripts/publish-managed-release.mjs verify-upstream \
            --lock t3-reasoning/source.lock.json \
            --upstream-release t3-reasoning/upstream-release.json

      # The four public values arrive only through these exact variables and
      # are written once; nothing prints them.
      - name: Build the public-config file from the four named variables
        id: public-config
        env:
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
          T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-inputs"
          node t3-reasoning/scripts/publish-managed-release.mjs public-config \
            --output "${RUNNER_TEMP}/release-inputs/public-config.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Find the newest published immutable managed release
        id: prior
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node t3-reasoning/scripts/publish-managed-release.mjs prior \
            --output "${RUNNER_TEMP}/prior/managed-release.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Resolve the managed release descriptor once
        id: resolve
        env:
          PRIOR_MANIFEST: ${{ steps.prior.outputs.prior_manifest }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          # Counter blocks reserve one billion values per main commit count.
          # Maximum 9000000 * 1000000000 + 999999999 is JS-safe.
          [ "$(git rev-parse --is-shallow-repository)" = "false" ]
          [ "$(git rev-parse HEAD)" = "${GITHUB_SHA}" ]
          MAIN_COUNT="$(git rev-list --count "${GITHUB_SHA}")"
          if ! [[ "${MAIN_COUNT}" =~ ^[1-9][0-9]{0,6}$ ]] || [ "${MAIN_COUNT}" -gt 9000000 ]; then
            echo "::error::main commit count exceeds the safe counter block bounds"
            exit 1
          fi
          RELEASE_COUNTER=$((MAIN_COUNT * 1000000000))
          if [ -z "${EXPECTED_MAIN_SHA}" ]; then
            if ! [[ "${GITHUB_RUN_NUMBER}" =~ ^[1-9][0-9]{0,8}$ ]]; then
              echo "::error::manual run number must be between 1 and 999999999"
              exit 1
            fi
            RELEASE_COUNTER=$((RELEASE_COUNTER + GITHUB_RUN_NUMBER))
          else
            [ "${EXPECTED_MAIN_SHA}" = "${GITHUB_SHA}" ]
          fi
          echo "RELEASE_COUNTER=${RELEASE_COUNTER}" >> "${GITHUB_ENV}"
          UPSTREAM_VERSION="$(node -p 'JSON.parse(require("node:fs").readFileSync("t3-reasoning/upstream-release.json", "utf8")).version')"
          args=(--lock t3-reasoning/source.lock.json --upstream-version "${UPSTREAM_VERSION}" --release-counter "${RELEASE_COUNTER}" --builder-revision "${GITHUB_SHA}" --public-config "${RUNNER_TEMP}/release-inputs/public-config.json" --output "${RUNNER_TEMP}/release-inputs/descriptor.json" --github-output "${GITHUB_OUTPUT}")
          if [ -n "${PRIOR_MANIFEST}" ]; then
            args+=(--prior-release "${PRIOR_MANIFEST}")
          fi
          node t3-reasoning/scripts/resolve-managed-release.mjs "${args[@]}"

      # The setting read needs repository Administration read, which the
      # workflow token cannot hold; the tag checks stay on the workflow token.
      - name: Require immutable releases and an unused tag before fan-out
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          T3_MANAGED_RELEASE_ADMIN_READ_TOKEN: ${{ secrets.T3_MANAGED_RELEASE_ADMIN_READ_TOKEN }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.release_version }}
        run: |
          set -euo pipefail
          node t3-reasoning/scripts/publish-managed-release.mjs preflight \
            --release-version "${RELEASE_VERSION}" \
            --github-output "${GITHUB_OUTPUT}"
          {
            echo "## t3 managed release resolve"
            echo
            echo "- version: \`${RELEASE_VERSION}\`"
            echo "- builder revision: \`${GITHUB_SHA}\`"
            echo "- release counter: ${RELEASE_COUNTER}"
          } >> "${GITHUB_STEP_SUMMARY}"

      # The only input the build rows and the publish job share: the resolved
      # descriptor and the public-config file, same run, short retention.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t3-managed-release-inputs
          path: |
            ${{ runner.temp }}/release-inputs/descriptor.json
            ${{ runner.temp }}/release-inputs/public-config.json
          if-no-files-found: error
          retention-days: 1

  build:
    needs: resolve
    if: github.repository == 'kgarg2468/harbor' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: managed-server-darwin-arm64
            runs-on: macos-15
            variant: managed-nightly
            builder: server
            platform: darwin
            arch: arm64
            format: tar.gz
            rust_target: aarch64-apple-darwin
          - id: managed-server-linux-x64
            runs-on: ubuntu-24.04
            variant: managed-nightly
            builder: server
            platform: linux
            arch: x64
            format: tar.gz
            rust_target: x86_64-unknown-linux-gnu
          - id: managed-nightly-darwin-arm64
            runs-on: macos-15
            variant: managed-nightly
            builder: desktop
            platform: darwin
            arch: arm64
            format: zip
            rust_target: aarch64-apple-darwin
          - id: reasoning-darwin-arm64
            runs-on: macos-15
            variant: reasoning
            builder: desktop
            platform: darwin
            arch: arm64
            format: zip
            rust_target: aarch64-apple-darwin
    env:
      ARTIFACT_ID: ${{ matrix.id }}
      PREPARE_VARIANT: ${{ matrix.variant }}
      BUILDER: ${{ matrix.builder }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
      RUST_TARGET: ${{ matrix.rust_target }}
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.13.1"

      - name: Require the exact trusted commit and a clean tree
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "${head}" != "${GITHUB_SHA}" ]; then
            echo "::error::checkout HEAD ${head} is not the trusted commit ${GITHUB_SHA}"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::checkout is not clean"
            exit 1
          fi

      - name: Install the pinned pnpm and Rust toolchain for this row's native target
        run: |
          set -euo pipefail
          if [ "$(node --version)" != "v${NODE_VERSION}" ]; then
            echo "::error::node $(node --version) is not v${NODE_VERSION}"
            exit 1
          fi
          npm install --global pnpm@11.10.0
          if [ "$(pnpm --version)" != "${PNPM_VERSION}" ]; then
            echo "::error::pnpm $(pnpm --version) is not ${PNPM_VERSION}"
            exit 1
          fi
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup target add "${RUST_TARGET}" --toolchain 1.95.0
          rustup default 1.95.0
          rustc_verbose="$(rustc -vV)"
          if ! grep -Fxq "host: ${RUST_TARGET}" <<< "${rustc_verbose}"; then
            echo "::error::rustc host is not ${RUST_TARGET}"
            printf '%s\n' "${rustc_verbose}"
            exit 1
          fi
          {
            echo "## t3 managed release build: ${ARTIFACT_ID}"
            echo
            echo "- runner: $(uname -sm)"
            echo "- node: $(node --version)"
            echo "- pnpm: $(pnpm --version)"
            echo "- rustc: $(rustc --version) (${RUST_TARGET})"
            echo "- cargo: $(cargo --version)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: t3-managed-release-inputs
          path: ${{ runner.temp }}/release-inputs

      - name: Require the descriptor to name this exact builder commit
        run: |
          set -euo pipefail
          node -e '
            const { readFileSync } = require("node:fs");
            const descriptor = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (descriptor.builderRevision !== process.env.GITHUB_SHA) {
              console.error(`descriptor builderRevision ${descriptor.builderRevision} is not ${process.env.GITHUB_SHA}`);
              process.exit(1);
            }
            console.log(`descriptor ${descriptor.releaseVersion} built by ${descriptor.builderRevision}`);
          ' "${RUNNER_TEMP}/release-inputs/descriptor.json"

      # A fresh tree for every row: both builders stamp and install in place
      # and refuse prior build state, so nothing is shared or reused.
      - name: Prepare a fresh source tree for this row
        run: |
          set -euo pipefail
          node t3-reasoning/scripts/prepare-source.mjs \
            --lock t3-reasoning/source.lock.json \
            --variant "${PREPARE_VARIANT}" \
            --destination "${RUNNER_TEMP}/prepared-source"

      - name: Build the artifact with the existing builder
        run: |
          set -euo pipefail
          case "${BUILDER}" in
            server)
              node t3-reasoning/scripts/build-managed-server-runtime.mjs \
                --source "${RUNNER_TEMP}/prepared-source" \
                --descriptor "${RUNNER_TEMP}/release-inputs/descriptor.json" \
                --public-config "${RUNNER_TEMP}/release-inputs/public-config.json" \
                --platform "${TARGET_PLATFORM}" --arch "${TARGET_ARCH}" \
                --destination "${RUNNER_TEMP}/built"
              ;;
            desktop)
              node t3-reasoning/scripts/build-managed-desktop-runtime.mjs \
                --source "${RUNNER_TEMP}/prepared-source" \
                --descriptor "${RUNNER_TEMP}/release-inputs/descriptor.json" \
                --public-config "${RUNNER_TEMP}/release-inputs/public-config.json" \
                --variant "${PREPARE_VARIANT}" \
                --destination "${RUNNER_TEMP}/built"
              ;;
            *)
              echo "::error::unknown builder ${BUILDER}"
              exit 1
              ;;
          esac
          ls -l "${RUNNER_TEMP}/built"

      # Both native server archives must start and pass the checked-in
      # two-client shared smoke on their own runner before they can leave it.
      # The exact expected archive is opened only inside a private root under
      # RUNNER_TEMP that this step alone removes, and the smoke runs from that
      # root under a scrubbed environment: the runner PATH, an isolated HOME
      # and TMPDIR, and T3CODE_SKIP_LOGIN_SHELL, nothing else. No token,
      # public config, or ambient HOME reaches the built server. Any missing
      # archive or entry, extraction failure, smoke failure, or timeout fails
      # this row, so its archive is never uploaded or published.
      - name: Start the built server archive and pass the shared smoke
        id: shared-smoke
        if: matrix.builder == 'server'
        timeout-minutes: 10
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/built/${ARTIFACT_ID}-${RELEASE_VERSION}.tar.gz"
          if [ -L "${archive}" ] || [ ! -f "${archive}" ]; then
            echo "::error::built archive ${archive} is not a regular file"
            exit 1
          fi
          node_bin="$(command -v node)"
          smoke_root="$(mktemp -d "${RUNNER_TEMP}/shared-smoke.XXXXXXXX")"
          trap 'rm -rf "${smoke_root}"' EXIT
          mkdir "${smoke_root}/runtime" "${smoke_root}/home" "${smoke_root}/tmp"
          tar -x -z -f "${archive}" -C "${smoke_root}/runtime"
          server_bin="${smoke_root}/runtime/node_modules/t3/dist/bin.mjs"
          if [ -L "${server_bin}" ] || [ ! -f "${server_bin}" ]; then
            echo "::error::extracted archive lacks a regular runtime/node_modules/t3/dist/bin.mjs"
            exit 1
          fi
          cd "${smoke_root}"
          env -i \
            PATH="${PATH}" \
            HOME="${smoke_root}/home" \
            TMPDIR="${smoke_root}/tmp" \
            T3CODE_SKIP_LOGIN_SHELL=1 \
            "${node_bin}" "${GITHUB_WORKSPACE}/t3-reasoning/scripts/smoke-shared.mjs" \
              --server-bin "${server_bin}"

      # Only the canonical archive and its inventory leave the runner.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t3-managed-build-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/built/*.${{ matrix.format }}
            ${{ runner.temp }}/built/*.inventory.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [resolve, build]
    if: github.repository == 'kgarg2468/harbor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.13.1"

      - name: Require the exact trusted commit and a clean tree
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "${head}" != "${GITHUB_SHA}" ]; then
            echo "::error::checkout HEAD ${head} is not the trusted commit ${GITHUB_SHA}"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::checkout is not clean"
            exit 1
          fi
          if [ "$(node --version)" != "v${NODE_VERSION}" ]; then
            echo "::error::node $(node --version) is not v${NODE_VERSION}"
            exit 1
          fi
          gh --version

      - name: Re-verify the lock, provenance, and the official upstream release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node t3-reasoning/scripts/publish-managed-release.mjs verify-upstream \
            --lock t3-reasoning/source.lock.json \
            --upstream-release t3-reasoning/upstream-release.json

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: t3-managed-release-inputs
          path: ${{ runner.temp }}/release-inputs

      # Each build row lands in its own directory named after its artifact.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: t3-managed-build-*
          path: ${{ runner.temp }}/builds
          merge-multiple: false

      - name: Assemble the four archives and inventories, then write the release closure
        run: |
          set -euo pipefail
          node t3-reasoning/scripts/publish-managed-release.mjs assemble \
            --builds "${RUNNER_TEMP}/builds" \
            --artifacts "${RUNNER_TEMP}/artifacts" \
            --inventory "${RUNNER_TEMP}/inventory.json"
          node t3-reasoning/scripts/write-managed-release-manifest.mjs \
            --descriptor "${RUNNER_TEMP}/release-inputs/descriptor.json" \
            --inventory "${RUNNER_TEMP}/inventory.json" \
            --artifacts "${RUNNER_TEMP}/artifacts" \
            --destination "${RUNNER_TEMP}/release"
          ls -l "${RUNNER_TEMP}/release"

      # Release creation, uploads, and publication run on the workflow token;
      # the admin-read secret serves only the repeated setting check.
      - name: Publish the immutable managed release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          T3_MANAGED_RELEASE_ADMIN_READ_TOKEN: ${{ secrets.T3_MANAGED_RELEASE_ADMIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          node t3-reasoning/scripts/publish-managed-release.mjs publish \
            --release-dir "${RUNNER_TEMP}/release" \
            --lock t3-reasoning/source.lock.json \
            --upstream-release t3-reasoning/upstream-release.json \
            --repository "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF}" \
            --builder-revision "${GITHUB_SHA}" \
            --github-output "${GITHUB_OUTPUT}"
