name: t3-reasoning

on:
  push:
    branches: [main]
    paths:
      - "t3-reasoning/**"
      - ".github/workflows/t3-reasoning.yml"
  pull_request:
    paths:
      - "t3-reasoning/**"
      - ".github/workflows/t3-reasoning.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Show toolchain
        run: node --version && git --version
      - name: Unit tests
        run: node --test t3-reasoning/tests/*.test.mjs

  markdown:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: markdownlint
        run: >
          npx --yes markdownlint-cli@0.41.0 --config .markdownlint.yml
          't3-reasoning/**/*.md'
